  <path d="M1030 265l205 97 197-78" fill="none" stroke="#A8F5DB" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1030 263l205 96 197-77" fill="none" stroke="#ECFFF8" stroke-width="2" stroke-linecap="round"/>
  <!-- Chassis -->
  <path d="M1065 381l-16 34 174 81 154-51" fill="none" stroke="url(#metal)" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M1223 453v43m170-95-16 44" fill="none" stroke="#6DC9B5" stroke-width="7"/>
  <!-- Three-dimensional wheels -->
  <g transform="translate(1087 443)">
    <ellipse cx="8" cy="0" rx="18" ry="24" fill="#496273"/><ellipse rx="18" ry="24" fill="#071522" stroke="#507F88" stroke-width="3"/>
