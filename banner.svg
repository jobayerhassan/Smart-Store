<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title description">
<title id="title">Smart Store — A smarter way to fill your cart</title>
<desc id="description">Animated three-dimensional shopping cart with floating groceries, luminous mint rails and an orbital platform against a midnight blue background. Animations respect reduced-motion preferences.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#060D19"/><stop offset=".55" stop-color="#091D2A"/><stop offset="1" stop-color="#06141D"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#18D6A1" stop-opacity=".25"/><stop offset="1" stop-color="#10CBA5" stop-opacity="0"/></radialGradient>
  <radialGradient id="blue"><stop stop-color="#338AFF" stop-opacity=".14"/><stop offset="1" stop-color="#338AFF" stop-opacity="0"/></radialGradient>
  <linearGradient id="titleFill" x2="1" y2=".7"><stop stop-color="#FAFFFF"/><stop offset=".55" stop-color="#E4FFF6"/><stop offset="1" stop-color="#57E5B8"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E0FFF7"/><stop offset=".25" stop-color="#6CDDC4"/><stop offset=".58" stop-color="#229980"/><stop offset=".8" stop-color="#B0F5DF"/><stop offset="1" stop-color="#42B39A"/></linearGradient>
  <linearGradient id="rail" x2=".4" y2="1"><stop stop-color="#ECFFF9"/><stop offset=".35" stop-color="#88EDCF"/><stop offset="1" stop-color="#2E8D7D"/></linearGradient>
  <linearGradient id="basketFront" x2=".2" y2="1"><stop stop-color="#49C5A4" stop-opacity=".32"/><stop offset="1" stop-color="#153F42" stop-opacity=".78"/></linearGradient>
  <linearGradient id="basketSide" x2="1" y2="1"><stop stop-color="#1E786D" stop-opacity=".6"/><stop offset="1" stop-color="#0D2B3A" stop-opacity=".92"/></linearGradient>
  <linearGradient id="platform" x2="0" y2="1"><stop stop-color="#25515B"/><stop offset="1" stop-color="#0A1D2B"/></linearGradient>
  <linearGradient id="platformTop" x2="1" y2="1"><stop stop-color="#153C48"/><stop offset="1" stop-color="#0A2230"/></linearGradient>
  <linearGradient id="milk" x2="1" y2=".5"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#BDE8DD"/></linearGradient>
  <linearGradient id="orange" x2=".9" y2="1"><stop stop-color="#FFE6A4"/><stop offset=".3" stop-color="#FFC46C"/><stop offset=".7" stop-color="#F38432"/><stop offset="1" stop-color="#BE4F23"/></linearGradient>
  <radialGradient id="tomato" cx=".3" cy=".2"><stop stop-color="#FFA78C"/><stop offset=".4" stop-color="#FF6856"/><stop offset="1" stop-color="#B52B32"/></radialGradient>
  <linearGradient id="leaf" x2="1" y2="1"><stop stop-color="#DAF79A"/><stop offset=".4" stop-color="#91CD65"/><stop offset="1" stop-color="#286C4B"/></linearGradient>
  <linearGradient id="bread" x2="1" y2="1"><stop stop-color="#FFE3A5"/><stop offset=".5" stop-color="#DDA166"/><stop offset="1" stop-color="#975237"/></linearGradient>
  <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#213F4F" stop-opacity=".95"/><stop offset="1" stop-color="#0A1D2C" stop-opacity=".98"/></linearGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="shadow" x="-35%" y="-35%" width="180%" height="190%"><feDropShadow dx="0" dy="15" stdDeviation="12" flood-color="#000812" flood-opacity=".5"/></filter>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10"/></filter>
  <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#77B9B0" opacity=".12"/></pattern>
</defs>
<style>
  text { font-family: 'Segoe UI', Arial, sans-serif; }
  .cart { animation: float 6s ease-in-out infinite; }
  .produce { animation: float 4.8s ease-in-out infinite; }
  .produce2 { animation: float 5.6s ease-in-out -2s infinite; }
  .card { animation: float 7s ease-in-out -1.5s infinite; }
  .orbit { stroke-dasharray: 9 24; animation: orbit 22s linear infinite; }
  .spark { animation: pulse 4s ease-in-out infinite; }
  .delay { animation-delay: -2s; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  @keyframes orbit { to { stroke-dashoffset: -264; } }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .cart,.produce,.produce2,.card,.orbit,.spark { animation: none; } }
</style>
<rect width="1600" height="640" rx="28" fill="url(#bg)"/>
<rect width="1600" height="640" rx="28" fill="url(#dots)"/>
<ellipse cx="1200" cy="330" rx="490" ry="360" fill="url(#halo)"/>
<ellipse cx="360" cy="-40" rx="570" ry="440" fill="url(#blue)"/>
<path d="M760 640L1230 300M960 640l360-340m-110 340 220-340m-420 255h590M1090 482h510" fill="none" stroke="#427F7D" stroke-opacity=".1"/>
<rect x="1" y="1" width="1598" height="638" rx="27" fill="none" stroke="#73AAAC" stroke-opacity=".16"/>
<!-- Editorial title block -->
<rect x="72" y="66" width="252" height="34" rx="17" fill="#14352F" stroke="#2C6657"/>
<circle cx="93" cy="83" r="4" fill="#71EDBC" class="spark"/>
<text x="107" y="89" font-size="13" fill="#B6EAD6" font-weight="650" letter-spacing="2">GROCERIES, REIMAGINED</text>
<text x="66" y="228" font-size="100" font-weight="800" letter-spacing="-4" fill="#010C13" opacity=".6">Smart Store.</text>
<text x="66" y="220" font-size="100" font-weight="800" letter-spacing="-4" fill="url(#titleFill)">Smart Store.</text>
<text x="74" y="278" font-size="30" fill="#E0F1ED" font-weight="400">A smarter way to fill your cart.</text>
<text x="74" y="335" font-size="22" fill="#9BB6C1">From what is in your pantry</text>
<text x="74" y="368" font-size="22" fill="#9BB6C1">to what is next on your plate.</text>
<g transform="translate(74 416)">
  <rect width="188" height="43" rx="10" fill="#143C35" stroke="#32725C"/>
  <path d="M16 23l5 5 10-13" fill="none" stroke="#7EEABA" stroke-width="2" stroke-linecap="round"/>
  <text x="41" y="28" font-size="16" font-weight="600" fill="#C7F7DC">Pantry-to-Plate</text>
  <rect x="202" width="172" height="43" rx="10" fill="#112C3B" stroke="#2C5160"/>
  <text x="221" y="28" font-size="16" fill="#C2DDE7">Budget Rescue</text>
  <rect x="388" width="144" height="43" rx="10" fill="#112C3B" stroke="#2C5160"/>
  <text x="407" y="28" font-size="16" fill="#C2DDE7">Less Waste</text>
</g>
<path d="M74 518h578" stroke="#24434D"/>
<text x="74" y="557" font-size="14" fill="#9AB7BE" letter-spacing="2.4">JAVA  /  OOP LAB  /  DIU</text>
<text x="74" y="591" font-size="12" fill="#77939D" letter-spacing="1.2">ACADEMIC PROJECT · FEATURES IN DEVELOPMENT</text>
<!-- Illuminated three-dimensional platform -->
<ellipse cx="1195" cy="528" rx="286" ry="74" fill="#020B16" opacity=".7" filter="url(#soft)"/>
<path d="M914 490v27c0 52 125 85 279 85s279-33 279-85v-27Z" fill="url(#platform)"/>
<ellipse cx="1193" cy="490" rx="279" ry="85" fill="url(#platformTop)" stroke="#347F7B" stroke-width="2"/>
<ellipse cx="1193" cy="494" rx="250" ry="68" fill="none" stroke="#67ECC9" stroke-width="3" opacity=".5" filter="url(#glow)"/>
<ellipse cx="1193" cy="490" rx="250" ry="68" fill="none" stroke="#57E0BB" stroke-width="1.5" opacity=".65"/>
<ellipse cx="1193" cy="490" rx="267" ry="77" fill="none" stroke="#A1FFE0" stroke-width="2" class="orbit" opacity=".6"/>
<path d="M972 561c104 47 324 50 443-1" fill="none" stroke="#39CBAF" stroke-width="2" opacity=".45"/>
<!-- Cart suspension shadow -->
<ellipse cx="1204" cy="487" rx="155" ry="27" fill="#000A12" opacity=".65" filter="url(#soft)"/>
<g class="cart">
  <!-- Back rail and handle -->
  <path d="M1029 282l-39-94-45-13" fill="none" stroke="#0A202B" stroke-width="18" stroke-linecap="round"/>
  <path d="M1029 282l-39-94-45-13" fill="none" stroke="url(#metal)" stroke-width="12" stroke-linecap="round"/>
  <path d="M945 175l-28-9" stroke="#08131E" stroke-width="18" stroke-linecap="round"/>
  <path d="M943 171l-26-8" stroke="#507481" stroke-width="5" stroke-linecap="round"/>
  <path d="M1030 265l197-66 205 85-197 78Z" fill="#2F7F70" fill-opacity=".12" stroke="#61B8A4" stroke-width="5" stroke-linejoin="round"/>
  <!-- Groceries inside basket -->
  <g class="produce2">
    <g transform="rotate(-17 1134 238)" filter="url(#shadow)">
      <rect x="1095" y="145" width="68" height="171" rx="34" fill="url(#bread)"/>
      <path d="M1110 175l29 8m-30 24l29 8m-30 24l29 8" stroke="#FFF0C5" stroke-width="9" stroke-linecap="round" opacity=".85"/>
      <path d="M1103 173q2-19 17-21" fill="none" stroke="#FFF0D1" stroke-width="3" opacity=".6"/>
    </g>
  </g>
  <g class="produce">
    <path d="M1198 289c-60-13-106-64-79-83 20-13 46 15 52 39-42-88-8-112 15-85 12 14 11 40 8 58 10-69 57-80 61-50 3 20-14 49-34 64 62-44 99-13 71 16-17 19-57 27-71 48Z" fill="url(#leaf)"/>
    <path d="M1208 290l-19-93m19 91 47-57m-49 53-52-50" fill="none" stroke="#CAE7A2" stroke-width="3" opacity=".65"/>
