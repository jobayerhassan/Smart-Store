    <path d="M1322 221l35-28v66l-35 28Z" fill="#1E5B53"/>
    <ellipse cx="1308" cy="124" rx="12" ry="5" fill="#74AAA0"/><ellipse cx="1308" cy="120" rx="12" ry="5" fill="#FFFFFF"/>
  </g>
  <circle cx="1208" cy="298" r="43" fill="url(#tomato)"/>
  <path d="M1206 262l-13-13 17 8 7-16 1 18 19-1-16 8" fill="#4F995A"/>
  <ellipse cx="1193" cy="285" rx="9" ry="5" fill="#FFD6BA" opacity=".45" transform="rotate(-35 1193 285)"/>
  <!-- Basket faces, with dimensional rails -->
  <path d="M1030 265l205 97-12 91-158-72Z" fill="url(#basketFront)" stroke="url(#rail)" stroke-width="5" stroke-linejoin="round"/>
  <path d="M1235 362l197-78-39 117-170 52Z" fill="url(#basketSide)" stroke="url(#metal)" stroke-width="5" stroke-linejoin="round"/>
  <g fill="none" stroke="url(#rail)" stroke-width="3" opacity=".88">
    <path d="M1064 281l27 112m10-94 22 109m12-92 14 104m16-89 11 101m22-86 4 98"/>
    <path d="M1042 301l189 88m-178-53 174 82m-165-51 162 77"/>
    <path d="M1272 347l-15 96m54-111-18 99m57-115-24 104m62-119-28 110"/>
    <path d="M1231 391l190-71m-193 98 183-64m-186 89 176-57"/>
